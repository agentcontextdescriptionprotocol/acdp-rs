[package]
name        = "acdp-verify"
version     = "0.3.2"
edition     = "2021"
description = "High-level body/publish-request verification (DID resolution + signature) for the Agent Context Distribution Protocol (ACDP)"
license     = "MIT OR Apache-2.0"
readme      = "README.md"
repository  = "https://github.com/agentcontextdistributionprotocol/acdp-rs"
homepage    = "https://github.com/agentcontextdistributionprotocol/acdp-rs"
documentation = "https://docs.rs/acdp-verify"
keywords    = ["acdp", "verification", "signature", "did", "ed25519"]
categories  = ["cryptography", "web-programming"]
rust-version = "1.86"

[features]
# Enables the resolver-backed Verifier and publish-request verification
# (did:web DID-document fetch). did:key offline verification works without it.
client = ["acdp-did/client"]
# Structured diagnostics on the verification pipeline (spans + stage events).
tracing = ["dep:tracing", "acdp-did/tracing"]

[dependencies]
acdp-primitives = { path = "../acdp-primitives", version = "0.4.0" }
acdp-types      = { path = "../acdp-types", version = "0.3.2" }
acdp-crypto     = { path = "../acdp-crypto", version = "0.1.5" }
tracing         = { version = "0.1", optional = true, default-features = false, features = ["attributes"] }
acdp-did        = { path = "../acdp-did", version = "0.2.2" }
acdp-validation = { path = "../acdp-validation", version = "0.3.2" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
