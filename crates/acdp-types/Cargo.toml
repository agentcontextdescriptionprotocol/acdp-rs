[package]
name        = "acdp-types"
version     = "0.2.0"
edition     = "2021"
description = "Wire types (Body, PublishRequest, DataRef, receipts, search) for the Agent Context Distribution Protocol (ACDP)"
license     = "MIT OR Apache-2.0"
readme      = "README.md"
repository  = "https://github.com/agentcontextdistributionprotocol/acdp-rs"
homepage    = "https://github.com/agentcontextdistributionprotocol/acdp-rs"
documentation = "https://docs.rs/acdp-types"
keywords    = ["acdp", "agent", "context", "wire-format", "serde"]
categories  = ["data-structures", "encoding"]
rust-version = "1.86"

[dependencies]
acdp-primitives = { path = "../acdp-primitives", version = "0.1.1" }
acdp-jcs        = { path = "../acdp-jcs", version = "0.1.2" }
acdp-crypto     = { path = "../acdp-crypto", version = "0.1.2" }
acdp-did        = { path = "../acdp-did", version = "0.1.2" }
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
chrono     = { version = "0.4", features = ["serde"] }
base64     = "0.22"
hex        = "0.4"
sha2       = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
