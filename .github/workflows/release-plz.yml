name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

# Supply-chain note (crates.io provenance) — see docs/supply-chain.md §crates.io.
# release-plz drives `cargo publish`, which today has no build-provenance /
# attestation mechanism comparable to npm --provenance or PyPI attestations;
# crates.io Trusted Publishing (OIDC, no long-lived token) is being rolled out
# upstream. This workflow is DELIBERATELY LEFT on the CARGO_REGISTRY_TOKEN flow
# and its version/publish behavior is unchanged. Migrating to crates.io Trusted
# Publishing is tracked as a conservative follow-up (roadmap §6.5): when
# release-plz-action documents an `id-token: write` OIDC path, add
# `permissions: id-token: write` to THIS job only and drop CARGO_REGISTRY_TOKEN.
jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'agentcontextdistributionprotocol' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: MarcoIeni/release-plz-action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        id: release-plz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # When this run actually publishes a new `acdp` to crates.io, tell
      # acdp-registry-rs immediately so it opens a bump PR instead of waiting up
      # to a week for its Dependabot cargo run. Fires only for the `acdp` crate;
      # other workspace crates (acdp-types, acdp-client, …) don't trigger it.
      - name: Detect acdp release
        id: acdp
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          version=$(printf '%s' "$RELEASES" | jq -r '.[] | select(.package_name == "acdp") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "acdp $version published — will notify acdp-registry-rs"
          else
            echo "no acdp release in this run"
          fi
      - name: Notify acdp-registry-rs
        if: ${{ steps.acdp.outputs.version != '' }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.ACDP_REGISTRY_SYNC_TOKEN }}
          repository: agentcontextdistributionprotocol/acdp-registry-rs
          event-type: acdp-released
          client-payload: '{"version": "${{ steps.acdp.outputs.version }}"}'
