name: Notify Website of Doc Changes

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'bindings/**'
      - 'README.md'
  # Manual trigger to re-sync the website on demand (e.g. to verify the
  # dispatch token without pushing a dummy docs change).
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Mint token for acdp-website
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ACDP_BOT_APP_ID }}
          private-key: ${{ secrets.ACDP_BOT_PRIVATE_KEY }}
          owner: agentcontextdistributionprotocol
          repositories: acdp-website
      - name: Trigger website sync
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.app.outputs.token }}
          repository: agentcontextdistributionprotocol/acdp-website
          event-type: docs-updated
