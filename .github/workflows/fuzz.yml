name: Fuzz

on:
  schedule:
    # Weekly, Monday 04:17 UTC (off the top of the hour to dodge load spikes).
    - cron: "17 4 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR gate: the fuzz workspace must keep compiling. Build only — no run.
  build:
    name: fuzz build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@0751bff5da373f43f04fdc57a72795931a822bd7 # cargo-fuzz
        with:
          tool: cargo-fuzz
      - run: cargo fuzz build --target x86_64-unknown-linux-gnu

  run:
    name: fuzz run (${{ matrix.target }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_jcs, fuzz_wire, fuzz_did_doc, fuzz_ssrf]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@0751bff5da373f43f04fdc57a72795931a822bd7 # cargo-fuzz
        with:
          tool: cargo-fuzz
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=300
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
