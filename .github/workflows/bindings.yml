name: bindings

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'bindings/**'
      - '.github/workflows/bindings.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'bindings/**'
      - '.github/workflows/bindings.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acdp-py:
    name: acdp-py (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          # Standalone [workspace] in each binding's Cargo.toml, so a
          # separate cache key keeps the bindings' target/ dirs from
          # competing with the root crate's.
          workspaces: bindings/acdp-py
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # `maturin develop` requires an active venv/conda env — it refuses
      # to install into the bare hosted-tool Python. Create one and
      # promote it into PATH + VIRTUAL_ENV for every subsequent step.
      - name: Create and activate venv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Install maturin + pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'maturin>=1.5,<2.0' pytest
      - name: Build the wheel (editable)
        working-directory: bindings/acdp-py
        run: maturin develop --release
      - name: pytest
        working-directory: bindings/acdp-py
        run: pytest tests/ -v

  acdp-node:
    name: acdp-node (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 (Maintenance LTS through 2025-04), 20 (LTS), 22 (LTS) —
        # 22 catches `node --test tests/` regressions where bare dir
        # paths started failing with MODULE_NOT_FOUND.
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: bindings/acdp-node
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install @napi-rs/cli
        working-directory: bindings/acdp-node
        run: npm install
      - name: Build the native binary
        working-directory: bindings/acdp-node
        run: npm run build:debug
      - name: node --test
        working-directory: bindings/acdp-node
        # Explicit glob: Node 22+ treats `--test tests/` as a module
        # path (MODULE_NOT_FOUND) instead of recursing into the dir.
        run: node --test tests/*.mjs

  acdp-wasm:
    name: acdp-wasm (wasm32 verifier core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The golden-parity test (sig-001 + wit-001) reads the canonical
      # spec fixtures; check them out so ACDP_REQUIRE_CONFORMANCE can make
      # a missing fixture a hard failure rather than a silent skip.
      - name: Check out the ACDP spec
        uses: actions/checkout@v7
        with:
          repository: agentcontextdistributionprotocol/agentcontextdistributionprotocol
          # Pinned so a spec-repo push cannot flip this job's result without
          # a commit here. Keep in sync with the pin in ci.yml's conformance
          # job. (main HEAD as of 2026-07-06)
          ref: 4df81332eb3d3710d73b061f6c2b3beae3f7794f
          path: acdp-spec
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          # This build-check job is the regression guard for the "core
          # stays wasm-clean" invariant: a tokio/reqwest/ring-flavoured
          # dependency creeping into a core crate breaks it here.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: bindings/acdp-wasm
      # 1. Native golden-vector parity: the same pure `core` functions the
      #    wasm exports wrap must reproduce sig-001 / wit-001 byte-for-byte
      #    (parity with the acdp-py / acdp-node suites and the Rust core).
      - name: Golden-vector parity (native)
        working-directory: bindings/acdp-wasm
        env:
          ACDP_SPEC_DIR: ${{ github.workspace }}/acdp-spec
          ACDP_REQUIRE_CONFORMANCE: "1"
        run: cargo test
      # 2. The wasm32-unknown-unknown build itself (verify-first default
      #    feature set — no getrandom draw at runtime, backend wired only
      #    to link). Debug + release so opt-level="s"/LTO also stay green.
      - name: Build wasm32-unknown-unknown (verifier core)
        working-directory: bindings/acdp-wasm
        run: |
          cargo build --target wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown
      # 3. Full browser package emit: wasm-pack runs wasm-bindgen + wasm-opt
      #    and produces the .js / .wasm / .d.ts a browser (the console)
      #    imports. Proves the FFI surface links end to end.
      - uses: taiki-e/install-action@0751bff5da373f43f04fdc57a72795931a822bd7 # wasm-pack
        with:
          tool: wasm-pack
      - name: wasm-pack build (--target web)
        working-directory: bindings/acdp-wasm
        run: |
          wasm-pack build --target web --out-dir pkg
          test -f pkg/acdp_wasm.js
          test -f pkg/acdp_wasm_bg.wasm
          test -f pkg/acdp_wasm.d.ts
      # 4. Exercise the exported wrappers in a REAL wasm engine (Node's V8)
      #    via wasm-bindgen-test — proves the FFI surface links and runs,
      #    not just that it compiles.
      - name: wasm-pack test (--node)
        working-directory: bindings/acdp-wasm
        run: wasm-pack test --node

  interop:
    name: interop (python ↔ node)
    runs-on: ubuntu-latest
    needs: [acdp-py, acdp-node]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: |
            bindings/acdp-py
            bindings/acdp-node
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      # `maturin develop` requires an active venv — see acdp-py job.
      - name: Create and activate venv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'maturin>=1.5,<2.0' pytest
      - name: Build the Python SDK (editable)
        working-directory: bindings/acdp-py
        run: maturin develop --release
      - name: Build the Node.js SDK
        working-directory: bindings/acdp-node
        run: |
          npm install
          npm run build:debug
      # Whole dir: cross-language behavioral parity (test_interop.py) AND
      # the API-surface + version drift guards (test_parity.py). Fails the
      # build if the two SDKs ever diverge in surface, behavior, or version.
      - name: Cross-language interop + parity pytest
        working-directory: bindings/interop
        run: pytest -v
