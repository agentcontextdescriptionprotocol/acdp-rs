name: bindings-release

# Publishes the `acdp` Node.js SDK (NAPI prebuilts) to npm.
#
# Trigger: push a tag of the form `acdp-node-v0.3.0`. The job matrix
# cross-builds the native `.node` for every target in
# `bindings/acdp-node/package.json`'s `napi.triples`, then a single
# publish job assembles the per-platform npm packages
# (`acdp-darwin-arm64`, `acdp-linux-x64-gnu`, …) plus the loader package
# (`acdp`) via `napi prepublish` and `npm publish`.
#
# Requires repo secret `NPM_TOKEN` (an npm automation token with publish
# rights to `acdp` and the `acdp-*` platform packages).

on:
  push:
    tags:
      - 'acdp-node-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only; skip npm publish'
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    working-directory: bindings/acdp-node

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            host: macos-latest
          - target: aarch64-apple-darwin
            host: macos-latest
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            host: ubuntu-latest
            # Cross-compiled with zig so we don't need an arm64 runner.
            zig: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/acdp-node
      - name: Install zig (cross targets)
        if: ${{ matrix.zig }}
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Install dependencies
        run: npm install
      - name: Build (native)
        if: ${{ !matrix.zig }}
        run: npx napi build --platform --release --target ${{ matrix.target }}
      - name: Build (zig cross)
        if: ${{ matrix.zig }}
        run: npx napi build --platform --release --target ${{ matrix.target }} --zig
      - name: Upload .node artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/acdp-node/*.node
          if-no-files-found: error

  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm install
      - name: Download all .node artifacts
        uses: actions/download-artifact@v8
        with:
          path: bindings/acdp-node/artifacts
          pattern: bindings-*
          merge-multiple: true
      - name: Scaffold per-platform npm package dirs
        run: npx napi create-npm-dir -t .
      - name: Assemble per-platform npm dirs
        run: npx napi artifacts --dir artifacts
      - name: List what will be published
        run: ls -R npm && ls -la *.node 2>/dev/null || true
      - name: Publish
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: npx napi prepublish -t npm --skip-gh-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
