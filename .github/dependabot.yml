version: 2
updates:
  # Root cargo workspace (umbrella acdp + crates/*).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # The language bindings are standalone [workspace]s (own Cargo.toml,
  # own lockfile), so the root cargo updater does not see their direct
  # third-party deps (pyo3, napi, wasm-bindgen). Watch each separately.
  - package-ecosystem: cargo
    directory: "/bindings/acdp-py"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]

  - package-ecosystem: cargo
    directory: "/bindings/acdp-node"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]

  - package-ecosystem: cargo
    directory: "/bindings/acdp-wasm"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # getrandom is intentionally DUAL-MAJOR here: 0.2 (with the `js`
      # feature, for the rand_core/OsRng path) plus a 0.4 alias
      # (`getrandom_wasm`, with `wasm_js`, for uuid v4). A major bump of
      # the 0.2 pin drops the `js` feature and breaks the wasm build
      # (this is what PR #122 did). Keep it pinned; bump by hand if ever
      # needed.
      - dependency-name: getrandom
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]

  # Node binding's npm dev toolchain (@napi-rs/cli).
  - package-ecosystem: npm
    directory: "/bindings/acdp-node"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]
