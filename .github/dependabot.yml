version: 2
updates:
  # Root cargo workspace (umbrella acdp + crates/*).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The language bindings are standalone [workspace]s (own Cargo.toml,
  # own lockfile), so the root cargo updater does not see their direct
  # third-party deps (pyo3, napi, wasm-bindgen). Watch each separately.
  # Note: a bump here can trip the blocking cargo-vet gate if the new
  # crate version isn't yet covered by supply-chain/config.toml.
  - package-ecosystem: cargo
    directory: "/bindings/acdp-py"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: "/bindings/acdp-node"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: "/bindings/acdp-wasm"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types: ["minor", "patch"]

  # Node binding's npm dev toolchain (@napi-rs/cli).
  - package-ecosystem: npm
    directory: "/bindings/acdp-node"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types: ["minor", "patch"]
