version: 2
updates:
  # Root cargo workspace (umbrella acdp + crates/*).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # The language bindings are standalone [workspace]s (own Cargo.toml,
  # own lockfile), so the root cargo updater does not see their direct
  # third-party deps (pyo3, napi, wasm-bindgen). Watch each separately.
  - package-ecosystem: cargo
    directory: "/bindings/acdp-py"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]

  - package-ecosystem: cargo
    directory: "/bindings/acdp-node"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]

  - package-ecosystem: cargo
    directory: "/bindings/acdp-wasm"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]

  # Node binding's npm dev toolchain (@napi-rs/cli).
  - package-ecosystem: npm
    directory: "/bindings/acdp-node"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]
