# Standalone package: NOT part of the parent acdp-rs crate (acdp-rs is a
# single-package crate with no [workspace] table). Built by `@napi-rs/cli`
# against an external Node.js, so it carries its own [workspace] table.
#
# The acdp library is pulled in via path. We keep `default-features = false`
# so reqwest/tokio/rustls don't end up in the .node binary — this binding
# never makes HTTP calls; host code is expected to use fetch / undici.
[package]
name        = "acdp-node"
version     = "0.7.0"
edition     = "2021"
description = "Agent Context Distribution Protocol — Node.js SDK"
license     = "MIT OR Apache-2.0"
publish     = false

[workspace]

[lib]
crate-type = ["cdylib"]

[build-dependencies]
napi-build = "2"

[dependencies]
acdp        = { path = "../..", default-features = false, features = ["test-transport"] }
# ^ test-transport: the bindings deliberately re-export allow_test_loopback
#   on their pinned FFI surface (expected_surface.json) as a HOST-side test
#   helper; the Rust-side hard gate targets Rust dependency trees.
napi        = { version = "2.16", features = ["napi8"] }
napi-derive = "3.5"
serde_json  = "1"
base64      = "0.22"
# Used only to parse the `expiresAt` RFC 3339 string into the
# `DateTime<Utc>` the builder expects. `serde` feature matches the
# parent crate so the parsed value round-trips identically.
chrono      = { version = "0.4", features = ["serde"] }
# `Zeroizing<[u8; 32]>` wipes the seed when the napi class is dropped,
# so we don't strip the protection the Rust `SigningKey` provides.
zeroize     = "1"
# `AcdpCanonicalizer.contentHash` hashes the JCS form. Versions match the
# parent crate so the digest is byte-identical to the core content_hash.
sha2        = "0.10"
hex         = "0.4"

[profile.release]
lto           = true
codegen-units = 1
strip         = "symbols"
